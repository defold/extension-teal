name: Build with bob

on: [push, pull_request]

jobs:
  build:
    # Keep this temporary branch focused on the Windows transpiler check.
    if: github.ref != 'refs/heads/codex/windows-transpiler-paths'
    uses: defold/github-actions-common/.github/workflows/bob.yml@master

  windows-transpilation:
    if: github.ref == 'refs/heads/codex/windows-transpiler-paths'
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - name: Get the existing Teal integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: defold/defold
          ref: 6f3960c6e62dd2ad26cbc852438b40902e73d0b1
          path: defold-fixture
          sparse-checkout: editor/test/resources/transpile_teal_project
      - name: Download prebuilt Bob and the original plugin
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/bob.jar" https://d.defold.com/archive/6f3960c6e62dd2ad26cbc852438b40902e73d0b1/bob/bob.jar
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/extension-teal-before.jar" https://raw.githubusercontent.com/defold/extension-teal/ec5c48d9140f5078a63a6c476e6e9dc5bb6e4456/teal/plugins/share/extension-teal.jar
      - name: Prepare nested Teal imports without a native engine build
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          project = Path(os.environ['RUNNER_TEMP']) / 'teal-project'
          shutil.copytree('defold-fixture/editor/test/resources/transpile_teal_project', project)
          settings = project / 'game.project'
          settings.write_text('\n'.join(line for line in settings.read_text().splitlines() if not line.startswith('dependencies#')) + '\n')
          (project / 'teal').mkdir()
          shutil.copyfile('teal/ext.manifest', project / 'teal/ext.manifest')
          shutil.copytree('teal/plugins', project / 'teal/plugins')
          shutil.copyfile(Path(os.environ['RUNNER_TEMP']) / 'extension-teal-before.jar', project / 'teal/plugins/share/extension-teal.jar')
          PY
      - name: Confirm the original plugin reproduces the Windows path error
        run: |
          if java -jar "$RUNNER_TEMP/bob.jar" --root "$RUNNER_TEMP/teal-project" --platform x86_64-win32 build > "$RUNNER_TEMP/teal-before.log" 2>&1; then
            cat "$RUNNER_TEMP/teal-before.log"
            echo 'Expected the original plugin to fail on nested Teal imports.'
            exit 1
          fi
          cat "$RUNNER_TEMP/teal-before.log"
          grep -F 'Unable to create parent dirs' "$RUNNER_TEMP/teal-before.log"
      - name: Build the same project with fixed Cyan paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          project = Path(os.environ['RUNNER_TEMP']) / 'teal-project'
          shutil.rmtree(project / 'build')
          shutil.copyfile('teal/plugins/share/extension-teal.jar', project / 'teal/plugins/share/extension-teal.jar')
          PY
          java -jar "$RUNNER_TEMP/bob.jar" --root "$RUNNER_TEMP/teal-project" --platform x86_64-win32 build
          python - <<'PY'
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'teal-project/build/default/modules'
          for module in ('mathutils', 'vector'):
              assert (output / (module + '.luac')).is_file(), 'Missing compiled module: ' + module
          PY
